name: CI

# Every pushed branch is checked, so a change is verified before anyone opens a PR;
# the result shows on the PR as well.
on:
  push:

permissions:
  contents: read

jobs:
  check:
    name: Tokens, contracts, types, Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile yet: the first green run's install can be committed as pnpm-lock.yaml.
      - run: pnpm install --no-frozen-lockfile
      - name: Build tokens, validate taxonomy and contracts, check component CSS
        run: pnpm check
      - name: Generated contract types are up to date
        run: git diff --exit-code -- '*.contract.d.json.ts' || (echo "Run pnpm contracts and commit the generated .d.json.ts files." && exit 1)
      - name: Typecheck components
        run: pnpm typecheck
      - name: Build Storybook
        run: pnpm build-storybook
        env:
          STORYBOOK_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: storybook-static

  deploy-storybook:
    name: Publish Storybook to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
